spring.application.name=ms-pago
server.port=8087

# ---------- Base de datos H2 en memoria ----------
spring.datasource.url=jdbc:h2:mem:pagosdb;DB_CLOSE_DELAY=-1
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------- Kafka ----------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Máximo (ms) que send() espera al broker antes de fallar; corto para que el POST no se cuelgue
kafka.producer.max-block-ms=${KAFKA_MAX_BLOCK_MS:3000}
spring.kafka.listener.auto-startup=${KAFKA_LISTENER_AUTO_STARTUP:true}

# ---------- Antifraude ----------
fraud.window-seconds=${FRAUD_WINDOW_SECONDS:10}
fraud.max-attempts=${FRAUD_MAX_ATTEMPTS:3}
fraud.cleanup-interval-ms=${FRAUD_CLEANUP_INTERVAL_MS:60000}

# Menos ruido del cliente de Kafka cuando el broker no está disponible
logging.level.org.apache.kafka=WARN

# Azure Entra ID: cada servicio valida el JWT (no son secretos, son identificadores públicos)
# Con estos dos valores SecurityConfig arma el emisor, la URL de llaves (JWKS) y las audiencias
azure.tenant-id=${AZURE_TENANT_ID:e5372bf0-c5e3-4286-887c-79069f209c1f}
azure.client-id=${AZURE_CLIENT_ID:42b7d432-638e-4b04-9368-9616b322e672}
