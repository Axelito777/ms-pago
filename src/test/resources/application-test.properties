# Perfil de test: sin broker real
spring.kafka.listener.auto-startup=false
# Puerto donde no hay nada: si algún test publica, falla rápido (y el servicio debe seguir respondiendo)
spring.kafka.bootstrap-servers=localhost:1
kafka.producer.max-block-ms=500
spring.datasource.url=jdbc:h2:mem:pagosdb-test;DB_CLOSE_DELAY=-1
logging.level.org.apache.kafka=ERROR
# Webpay con valores de prueba (el cliente real se reemplaza por FakeWebpayClient en los tests)
webpay.commerce-code=597055555532
webpay.api-key=llave-de-prueba
webpay.return-url=http://localhost/payments/webpay/return
webpay.frontend-result-url=http://front.test/#/pago/resultado
# DynamoDB desactivado: se usa NoOpPaymentAuditStore (sin AWS)
dynamodb.enabled=false
